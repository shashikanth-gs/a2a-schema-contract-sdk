name: Node validation, secure resolution and published SDK compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22.23.3" }
          - { os: ubuntu-latest, node: "24.21.0" }
          - { os: macos-latest, node: "24.21.0" }
          - { os: windows-latest, node: "24.21.0" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: resolver-${{ matrix.os }}-${{ matrix.node }}
          path: |
            js/reports/
            js/coverage/
            js/artifacts/
          if-no-files-found: error
  compatibility:
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["22.23.3", "24.21.0"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/a2a-js-1.3.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: research/a2a-js-1.3.0/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node structural.mjs
      - run: npm audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-node${{ matrix.node }}
          path: |
            research/a2a-js-1.3.0/report-node*.json
            research/a2a-js-1.3.0/structural-report.json
