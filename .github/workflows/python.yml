name: Python quality and installed artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: ubuntu-latest, python: "3.14"}
          - {os: macos-latest, python: "3.14"}
          - {os: windows-latest, python: "3.14"}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.1"
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check src tests scripts examples
      - run: uv run ruff check src tests scripts examples
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml
      - run: uv run coverage json --include='*/core/*' --fail-under=100 -o reports/core-coverage.json
      - run: uv run python scripts/check_package.py
      - run: uv run pip-audit --local --format json --output reports/dependency-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: |
            python/dist/
            python/reports/
          if-no-files-found: error
