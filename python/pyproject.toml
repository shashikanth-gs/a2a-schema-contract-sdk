[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "a2a-schema-contract"
version = "0.1.0.dev0"
description = "Framework-independent Schema Contract validation for A2A agents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "src/a2a_schema_contract/resources/LICENSE"]
authors = [{name = "Shashi Kanth"}]
classifiers = [
  "Development Status :: 3 - Alpha", "Intended Audience :: Developers", "Typing :: Typed",
  "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",
]
dependencies = ["jsonschema==4.26.0", "referencing==0.37.0", "h11==0.16.0"]

[project.optional-dependencies]
a2a = ["a2a-sdk==1.2.2"]
server = ["a2a-sdk[http-server]==1.2.2"]

[project.urls]
Repository = "https://github.com/shashikanth-gs/a2a-schema-contract-sdk"
Issues = "https://github.com/shashikanth-gs/a2a-schema-contract-sdk/issues"

[dependency-groups]
dev = [
  "ruff==0.17.0",
  "mypy==2.4.0",
  "types-jsonschema==4.26.0.20261006",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "pytest-cov==7.1.0",
  "build==1.6.1",
  "twine==7.0.0",
  "pip-audit==2.10.1",
  "uvicorn==0.42.0",
  "types-protobuf==7.35.1.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_schema_contract"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "scripts/", "examples/", "README.md", "LICENSE", "pyproject.toml", "uv.lock"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
timeout = 30
addopts = "--strict-config --strict-markers -ra"

[tool.coverage.run]
branch = true
source = ["a2a_schema_contract"]

[tool.coverage.report]
show_missing = true
fail_under = 90
